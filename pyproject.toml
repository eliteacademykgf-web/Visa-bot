[project]
name = "visa-duty-bot"
version = "0.1.0"
description = "Duty management bot for visa slot checks (manual checks, automated coordination)"
requires-python = ">=3.12"

dependencies = [
    "aiogram>=3.13,<4",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "apscheduler>=3.10,<4",
    "redis>=5.2",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "jinja2>=3.1",
    "python-multipart>=0.0.17",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "httpx>=0.27",
    "openpyxl>=3.1",
    "playwright>=1.49",
    "cryptography>=44.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.7",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "F", "W",   # pycodestyle / pyflakes
    "I",             # isort
    "UP",            # pyupgrade
    "B",             # bugbear
    "DTZ",           # flake8-datetimez -- запрещает naive datetime
    "ASYNC",
    "RUF",
]
ignore = [
    "B008",              # FastAPI Depends() в аргументах по умолчанию
    "RUF001",            # комментарии и докстринги на русском: кириллические
    "RUF002",            # буквы, «ёлочки» и тире — это не «неоднозначные
    "RUF003",            # символы», а нормальный текст
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["DTZ"]
"alembic/*" = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = []
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["apscheduler.*", "testcontainers.*"]
ignore_errors = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::DeprecationWarning"]
