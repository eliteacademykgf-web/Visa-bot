name: visa-duty-bot

x-app: &app
  build: .
  env_file: [.env]
  depends_on:
    migrator:
      condition: service_completed_successfully
  restart: unless-stopped

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-visa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-visa}
      POSTGRES_DB: ${POSTGRES_DB:-visa_duty}
      # БД работает в UTC; отображение в локальном времени — задача приложения.
      TZ: UTC
      PGTZ: UTC
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-visa} -d ${POSTGRES_DB:-visa_duty}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Одноразовый прогон миграций: остальные сервисы стартуют только после его
  # успешного завершения, поэтому гонки «старая схема / новый код» не бывает.
  migrator:
    build: .
    env_file: [.env]
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  bot:
    <<: *app
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      migrator:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  scheduler:
    <<: *app
    command: ["python", "-m", "app.scheduler.main"]
    # Свипы защищены advisory-локами, но держать один экземпляр проще
    # и достаточно: работа планировщика измеряется миллисекундами в минуту.
    deploy:
      replicas: 1

  # Мониторинг вынесен в отдельный процесс: браузер держит память и живёт
  # секунды, мешать его с лёгкими свипами планировщика нельзя.
  monitor:
    <<: *app
    command: ["python", "-m", "app.monitor.worker"]
    volumes:
      - artifacts:/app/artifacts
      - ./config:/app/config:ro
      # Профиль браузера обязан пережить перезапуск контейнера: в нём живёт
      # сессия, полученная ручным входом. Без этого тома каждый рестарт
      # требовал бы заново звать человека проходить Turnstile.
      - profiles:/app/profiles
    deploy:
      replicas: 1

  web:
    <<: *app
    command:
      ["uvicorn", "app.web.main:app", "--host", "0.0.0.0", "--port", "8000", "--proxy-headers"]
    ports:
      - "127.0.0.1:8000:8000"

volumes:
  pgdata:
  redisdata:
  artifacts:
  profiles:
